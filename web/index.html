<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172c2d" />
    <title>Log Pose · research console</title>
    <meta
      name="description"
      content="Explore dated software market inventories from 2020 to 2026 and inspect sourced company research."
    />
    <link rel="icon" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./console.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">skip to research view</a>
    <div class="shell">
      <header class="site-header">
        <div class="identity">
          <span class="log-pose-mark" aria-hidden="true"><span></span></span>
          <div>
            <h1 class="identity-name">Log Pose</h1>
            <p class="identity-note">software evidence console</p>
          </div>
        </div>
        <dl class="desk-status" aria-label="research scope">
          <div><dt>source window</dt><dd id="inventory-window">loading</dd></div>
          <div><dt>research mode</dt><dd>inspect / compare</dd></div>
          <div><dt>evidence</dt><dd>dated + pinned</dd></div>
        </dl>
        <a class="source-link" href="https://github.com/haidmoham/log-pose">source ↗</a>
      </header>

      <nav class="tabs" aria-label="research views">
        <button type="button" data-view="data" aria-current="page" disabled><span>01</span> research desk</button>
        <button type="button" data-view="overview" disabled><span>02</span> companies</button>
        <button type="button" data-view="compare" disabled><span>03</span> compare <output id="pin-count">0</output></button>
        <button type="button" data-view="topology" disabled><span>04</span> relationships</button>
        <button type="button" data-view="explore" disabled><span>05</span> source audit</button>
      </nav>

      <main id="view" aria-busy="true">
        <p class="loading">loading source records…</p>
      </main>

      <footer>
        <span>log pose / source inventory + selected research</span>
        <span>source dates and limits accompany each view.</span>
      </footer>
    </div>
    <script src="./research-model.js"></script>
    <script src="./console-ui.js"></script>
    <script src="./explore-view.js"></script>
    <script src="./data-view.js"></script>
    <script src="./topology-webgl.js"></script>
    <script src="./topology-view.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
