<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f3ee" />
    <title>Log Pose · research console</title>
    <meta
      name="description"
      content="Explore dated software market inventories from 2020 to 2026 and inspect sourced company research."
    />
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./console.css" />
    <link rel="stylesheet" href="./temporal-graph.css" />
    <link rel="stylesheet" href="./graph-workspace.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">skip to research view</a>
    <div class="shell">
      <header class="site-header">
        <div class="identity">
          <span class="log-pose-mark" aria-hidden="true"><span></span></span>
          <div>
            <h1 class="identity-name">log pose</h1>
            <p class="identity-note">software evidence console</p>
          </div>
        </div>
        <dl class="desk-status" aria-label="research scope">
          <div><dt>source window</dt><dd id="inventory-window">loading</dd></div>
          <div><dt>research mode</dt><dd>inspect / compare</dd></div>
          <div><dt>evidence</dt><dd>dated + pinned</dd></div>
        </dl>
        <a class="source-link" href="https://github.com/haidmoham/log-pose">source ↗</a>
      </header>

      <nav class="tabs" aria-label="research views">
        <a href="./atlas.html">atlas</a>
        <button type="button" data-view="data" disabled>evidence</button>
        <button type="button" data-view="overview" disabled>companies</button>
        <button type="button" data-view="compare" disabled hidden>compare <output id="pin-count">0</output></button>
        <button type="button" data-view="explore" disabled>sources</button>
      </nav>

      <main id="view" aria-busy="true">
        <p class="loading">loading source records…</p>
      </main>

      <footer>
        <span>log pose / retained market research</span>
        <a href="./atlas.html">open the atlas →</a>
        <a href="./experimental/index.html">experimental space →</a>
      </footer>
    </div>
    <script src="./research-model.js"></script>
    <script src="./console-ui.js"></script>
    <script src="./explore-view.js"></script>
    <script src="./data-view.js"></script>
    <script src="./discovery-topology-model.js"></script>
    <script src="./discovery-topology-view.js"></script>
    <script src="./temporal-graph-webgl.js"></script>
    <script src="./temporal-graph.js"></script>
    <script src="./temporal-topology-view.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
