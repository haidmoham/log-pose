[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "log-pose"
version = "0.1.0"
description = "Dated evidence about software markets"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4", "beautifulsoup4>=4.12,<5", "warcio>=1.8.1,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
log-pose = "log_pose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
