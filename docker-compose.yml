services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logpose
      POSTGRES_PASSWORD: logpose
      POSTGRES_DB: logpose
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logpose"]
      interval: 2s
      retries: 20
volumes:
  pgdata:
